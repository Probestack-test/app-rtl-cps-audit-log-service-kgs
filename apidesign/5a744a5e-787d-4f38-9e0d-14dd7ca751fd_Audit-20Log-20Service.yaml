openapi: 3.0.3
info:
  title: Audit Log Service
  version: 1.0.0
  description: |
    Microservice for recording immutable audit events across the platform.
    Supports append-only writes, actor and resource filtering, and export for compliance.
  contact:
    name: Compliance Engineering Team
    email: audit@example.com

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development

security: []
# Explicitly marks this API as public (no authentication required)

tags:
  - name: Events
    description: Operations on audit events

paths:
  /events:
    get:
      tags: [Events]
      summary: List audit events
      description: Returns a paginated list of audit events, optionally filtered by actor, action, or time window.
      operationId: listAuditEvents
      parameters:
        - name: actorEmail
          in: query
          schema:
            type: string
            format: email
          description: Filter by the user who performed the action
        - name: action
          in: query
          schema:
            type: string
            enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT, EXPORT]
          description: Filter by action type
        - name: resourceType
          in: query
          schema:
            type: string
          description: Filter by the type of resource acted upon (e.g., "Invoice")
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
          description: Return events at or after this timestamp
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
          description: Return events at or before this timestamp
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (starts at 1)
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of items per page
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Events]
      summary: Record an audit event
      description: Appends a new event to the immutable log. The `eventId` is generated by the server. Events cannot be modified once written.
      operationId: createAuditEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditEventRequest"
      responses:
        "201":
          description: Audit event recorded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get an audit event by ID
      description: Retrieves a single audit event including its before and after value snapshots.
      operationId: getAuditEventById
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: Unique audit event identifier (UUID)
      responses:
        "200":
          description: Audit event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "404":
          description: Audit event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [Events]
      summary: Annotate an audit event
      description: Adds a compliance annotation to an existing event. The original event payload remains immutable.
      operationId: annotateAuditEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: Unique audit event identifier (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotateAuditEventRequest"
      responses:
        "200":
          description: Audit event annotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Events]
      summary: Purge an audit event
      description: Removes an event that has passed its retention period. Events within retention cannot be purged.
      operationId: purgeAuditEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: Unique audit event identifier (UUID)
      responses:
        "204":
          description: Audit event purged successfully (no content returned)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  schemas:
    AuditEvent:
      type: object
      required:
        - eventId
        - action
        - resourceType
        - occurredAt
      properties:
        eventId:
          type: string
          description: Unique audit event ID (UUID)
          example: "a1u2d3t4"
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT, EXPORT]
          example: "UPDATE"
        resourceType:
          type: string
          example: "Invoice"
        resourceId:
          type: string
          example: "INV-2026-00317"
        actorEmail:
          type: string
          format: email
          example: "finance.admin@example.com"
        actorRole:
          type: string
          example: "ORG_ADMIN"
        ipAddress:
          type: string
          example: "203.0.113.42"
        beforeValue:
          type: object
          additionalProperties: true
          description: Snapshot of the resource before the change
        afterValue:
          type: object
          additionalProperties: true
          description: Snapshot of the resource after the change
        annotation:
          type: string
          example: "Reviewed during Q3 audit"
        occurredAt:
          type: string
          format: date-time
          example: "2026-08-12T10:00:00Z"

    CreateAuditEventRequest:
      type: object
      required:
        - action
        - resourceType
        - actorEmail
      properties:
        action:
          type: string
          enum: [CREATE, READ, UPDATE, DELETE, LOGIN, LOGOUT, EXPORT]
          example: "UPDATE"
        resourceType:
          type: string
          example: "Invoice"
        resourceId:
          type: string
          example: "INV-2026-00317"
        actorEmail:
          type: string
          format: email
          example: "finance.admin@example.com"
        actorRole:
          type: string
          example: "ORG_ADMIN"
        ipAddress:
          type: string
          example: "203.0.113.42"
        beforeValue:
          type: object
          additionalProperties: true
        afterValue:
          type: object
          additionalProperties: true

    AnnotateAuditEventRequest:
      type: object
      required:
        - annotation
      properties:
        annotation:
          type: string
          maxLength: 1000
          example: "Reviewed during Q3 audit"

    AuditEventListResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          example: 24810
        totalPages:
          type: integer
          example: 1241
        content:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400
        errorCode:
          type: string
          example: "INVALID_DATE_RANGE"
        message:
          type: string
          example: "Validation failed: fromDate must be before toDate"
        timestamp:
          type: string
          format: date-time
          example: "2026-08-12T10:00:00Z"
        path:
          type: string
          example: "/v1/events"

  responses:
    BadRequest:
      description: Invalid request - the server could not understand the payload or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error - something went wrong on the server side.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
